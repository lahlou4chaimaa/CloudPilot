- alert: ServerExporterDown
  expr: up{job="cloudpilot-servers"} == 0
  for: 30s
  labels:
    severity: critical
  annotations:
    summary: "Serveur {{ $labels.server }} indisponible"
    description: "Prometheus ne reçoit plus les métriques de {{ $labels.server }}."